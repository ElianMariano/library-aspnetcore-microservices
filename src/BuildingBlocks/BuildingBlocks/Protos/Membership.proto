syntax = "proto3";

option csharp_namespace = "Member.Grpc";

package member;

service MemberService {
  rpc CanMakeLoan (CanMakeLoanRequest) returns (CanMakeLoanResponse);
}

message CanMakeLoanRequest {
  string member_id = 1;
  int32 quantity = 2;
}

message CanMakeLoanResponse {
  bool able_to_loan = 1;
}